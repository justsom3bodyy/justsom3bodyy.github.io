<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лига Инженеров - Управление</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1c1c1e; color: white; padding: 20px; margin: 0; }
        .joystick { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; justify-content: center; margin: 40px auto; }
        button { padding: 15px; font-size: 18px; border: none; border-radius: 12px; background: #007aff; color: white; cursor: pointer; font-weight: bold; }
        button:active { background: #0051a8; }
        .status { margin-top: 25px; font-size: 16px; color: #34c759; min-height: 24px; }
        .win-btn { background: #34c759; width: 80%; max-width: 250px; margin: 20px auto; padding: 15px; display: block; font-size: 16px; }
    </style>
</head>
<body>

    <h2>🤖 Пульт Робототехника</h2>
    <p style="color: #8e8e93;">Протестируйте моторы: сделайте не менее 5 шагов роботом, чтобы завершить миссию!</p>

    <div class="joystick">
        <div></div><button onclick="move('Вперед')">⬆️</button><div></div>
        <button onclick="move('Влево')">⬅️</button><div>⚙️</div><button onclick="move('Вправо')">➡️</button>
        <div></div><button onclick="move('Назад')">⬇️</button><div></div>
    </div>

    <div id="status" class="status">Ожидание запуска двигателей...</div>

    <button class="win-btn" onclick="finishMission()">✅ Сдать тех-отчет</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let totalSteps = 0;

        function move(dir) {
            totalSteps++;
            document.getElementById('status').innerText = `Тест: Движение ${dir} (Шагов: ${totalSteps}/5)`;
        }

        function finishMission() {
            if (totalSteps >= 5) {
                // Формируем JSON-пакет для бота
                const payload = JSON.stringify({
                    task: "robot_win",
                    b: 100, // Выдаем 100 коинов
                    s: 25   // Выдаем 25 очков опыта
                });
                // Отправляем боту и закрываем окно
                tg.sendData(payload);
            } else {
                alert(`⚠️ Калибровка не завершена! Робот сделал всего ${totalSteps} шагов из 5.`);
            }
        }
    </script>
</body>
</html>
